name: Validate squad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate squad structure
        run: python tests/validate_squad.py
      - name: Run routing smoke test
        run: python tests/smoke_test.py
